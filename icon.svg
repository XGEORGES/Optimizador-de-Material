<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="48" y="48" width="416" height="416" rx="24" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.4"/>
  <rect x="72" y="72" width="368" height="368" rx="16" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12 12" opacity="0.6"/>
  <!-- Pieza 1 (L-Shape) -->
  <path d="M 110 110 L 320 110 L 320 220 L 220 220 L 220 380 L 110 380 Z" fill="url(#cyanGrad)" fill-opacity="0.85" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <!-- Agujero interior -->
  <circle cx="165" cy="165" r="28" fill="#0f172a" stroke="#f87171" stroke-width="5"/>
  <!-- Pieza 2 Anidada dentro de agujero / esquina -->
  <rect x="250" y="250" width="150" height="150" rx="12" fill="url(#pinkGrad)" fill-opacity="0.85" stroke="#ffffff" stroke-width="6"/>
  <circle cx="325" cy="325" r="25" fill="#0f172a" stroke="#f87171" stroke-width="5"/>
</svg>
